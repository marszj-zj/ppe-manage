<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>劳动防护用品领用登记 - 登录</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-box">
    <div style="text-align:center;margin-bottom:28px;">
      <div style="font-size:36px;font-weight:700;color:#1a73e8;letter-spacing:2px;margin-bottom:6px;">劳动防护用品</div>
      <div style="font-size:28px;font-weight:600;color:#333;letter-spacing:4px;">管理系统</div>
      <div style="width:60px;height:3px;background:linear-gradient(90deg,#1a73e8,#4fc3f7);margin:14px auto 0;border-radius:2px;"></div>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;height:44px;font-size:16px;letter-spacing:4px;">登 录</button>
    </form>
    <div style="margin-top:24px;padding-top:20px;border-top:1px solid #eee;text-align:center;">
      <p style="font-size:13px;color:#888;margin-bottom:10px;">手机扫码登录</p>
      <img id="loginQr" src="" alt="登录二维码" style="width:130px;height:130px;border:1px solid #eee;border-radius:8px;padding:4px;background:#fff;">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    // 生成登录二维码（手机扫码打开本页）
    const loginUrl = window.location.origin + window.location.pathname;
    document.getElementById('loginQr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(loginUrl);

    // 如果已登录，直接跳转
    const currentUser = Auth.getCurrentUser();
    if (currentUser) {
      Auth.redirectByRole(currentUser.role);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      Common.showLoading('登录中...');
      const result = await Auth.login(username, password);
      Common.hideLoading();

      if (result.success) {
        Common.toast('登录成功', 'success');
        setTimeout(() => Auth.redirectByRole(result.user.role), 500);
      } else {
        Common.toast(result.message, 'error');
      }
    });
  </script>
</body>
</html>
