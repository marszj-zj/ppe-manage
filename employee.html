<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>劳动防护用品领用登记</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .voucher-card { background:#fff; border-radius:8px; padding:16px; margin-bottom:12px; }
    .voucher-header { text-align:center; border-bottom:2px dashed #e0e0e0; padding-bottom:12px; margin-bottom:12px; }
    .voucher-header h3 { margin:0 0 4px 0; color:#1e3a8a; font-size:18px; }
    .voucher-reqno { font-size:13px; color:#666; }
    .voucher-info-row { display:flex; justify-content:space-between; font-size:14px; padding:4px 0; }
    .voucher-info-row .label { color:#666; }
    .voucher-info-row .value { font-weight:500; color:#333; }
    .voucher-table { width:100%; border-collapse:collapse; margin:8px 0; font-size:13px; }
    .voucher-table th { background:#f5f7fa; padding:6px 4px; text-align:left; border:1px solid #e0e0e0; font-weight:600; }
    .voucher-table td { padding:6px 4px; border:1px solid #e0e0e0; }
    .voucher-sign-area { text-align:center; margin-top:12px; }
    .voucher-sign-area img { max-width:200px; max-height:80px; border:1px solid #eee; border-radius:4px; }
    .voucher-sign-label { font-size:12px; color:#999; margin-top:4px; }
    .status-badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:600; }
    .status-pending { background:#fef3c7; color:#92400e; }
    .status-approved { background:#d1fae5; color:#065f46; }
    .status-rejected { background:#fee2e2; color:#991b1b; }
    .history-item { background:#fff; border-radius:8px; padding:12px; margin-bottom:8px; cursor:pointer; border:1px solid #e5e7eb; }
    .history-item:active { background:#f3f4f6; }
    .history-item-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
    .history-reqno { font-size:13px; font-weight:600; color:#1e3a8a; }
    .history-time { font-size:11px; color:#999; }
    .history-items { font-size:12px; color:#666; margin-top:4px; }
    .history-empty { text-align:center; padding:40px 20px; color:#999; }
    .btn-history { display:block; width:100%; padding:10px; background:#f0f4ff; color:#1e3a8a; border:1px solid #c7d2fe; border-radius:6px; font-size:14px; font-weight:500; margin-bottom:12px; cursor:pointer; }
    .btn-history:active { background:#e0e7ff; }
    .reject-reason { background:#fee2e2; color:#991b1b; padding:8px; border-radius:4px; font-size:13px; margin-top:8px; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1 id="pageTitle">劳动防护用品领用登记</h1>
  </div>

  <div class="container">
    <!-- 步骤1：填写信息 -->
    <div id="step1" class="card">
      <button class="btn-history" onclick="showHistory()">📋 我的领用记录</button>
      <h3>领用信息</h3>
      <div class="form-group">
        <label>产线</label>
        <input type="text" id="lineName" readonly style="background:#f5f5f5;">
      </div>
      <div class="form-group">
        <label>姓名 <span style="color:#f44336;">*</span></label>
        <input type="text" id="employeeName" placeholder="请输入您的姓名" maxlength="20">
      </div>
      <div class="form-group">
        <label>选择班组长 <span style="color:#f44336;">*</span></label>
        <select id="teamLeaderSelect">
          <option value="">请选择班组长</option>
        </select>
      </div>
      <div class="form-group">
        <label>用工性质 <span style="color:#f44336;">*</span></label>
        <div class="radio-group">
          <label><input type="radio" name="workerType" value="formal"> 正式工</label>
          <label><input type="radio" name="workerType" value="labor"> 劳务工</label>
        </div>
      </div>
      <div style="text-align:right;margin-bottom:8px;">
        <a href="javascript:void(0)" onclick="refreshData()" style="font-size:12px;color:#999;text-decoration:underline;">🔄 刷新数据</a>
      </div>
      <button class="btn btn-primary btn-block" onclick="goStep2()">下一步：选择用品</button>
    </div>

    <!-- 步骤2：选择用品 -->
    <div id="step2" class="card" style="display:none;">
      <h3>选择领用用品</h3>
      <p style="font-size:12px;color:#999;margin-bottom:10px;">勾选需要领用的用品，可多选</p>
      <div class="supply-list" id="supplyList"></div>
      <div id="selectedItems" style="margin-top:12px;"></div>
      <div class="btn-group" style="margin-top:12px;">
        <button class="btn btn-default" onclick="goStep1()">上一步</button>
        <button class="btn btn-primary" onclick="goStep3()">下一步：签名</button>
      </div>
    </div>

    <!-- 步骤3：签名 -->
    <div id="step3" class="card" style="display:none;">
      <h3>手写签名</h3>
      <div id="summaryArea" style="margin-bottom:12px;"></div>
      <canvas id="signatureCanvas" class="signature-canvas"></canvas>
      <p class="signature-label">请在上方区域手写签名</p>
      <div class="btn-group" style="margin-top:12px;">
        <button class="btn btn-default" onclick="goStep2()">上一步</button>
        <button class="btn btn-default" onclick="clearSignature()">清除重签</button>
        <button class="btn btn-success" onclick="submitRequisition()">提交领用</button>
      </div>
    </div>

    <!-- 凭证单详情（提交成功 / 历史记录详情共用） -->
    <div id="stepVoucher" class="card" style="display:none;">
      <div id="voucherContent"></div>
      <div class="btn-group" style="margin-top:12px;">
        <button class="btn btn-default" id="voucherBackBtn" onclick="voucherBack()">返回</button>
        <button class="btn btn-primary" onclick="resetForm()">继续领用</button>
      </div>
    </div>

    <!-- 我的领用记录列表 -->
    <div id="stepHistory" class="card" style="display:none;">
      <h3>我的领用记录</h3>
      <p style="font-size:12px;color:#999;margin-bottom:10px;">点击记录查看凭证详情和最新状态</p>
      <div id="historyList"></div>
      <button class="btn btn-default btn-block" style="margin-top:12px;" onclick="goStep1()">返回领用</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-init.js"></script>
  <script src="js/common.js"></script>
  <script src="js/signature.js"></script>
  <script>
    let currentLine = null;
    let teamLeaders = [];
    let supplies = [];
    let selectedSupplies = [];
    let sigPad = null;
    let voucherBackTarget = 'step1'; // 凭证详情页返回目标
    let lineLoadPromise = null;    // 产线信息加载Promise
    let teamLeadersLoadPromise = null; // 班组长列表加载Promise
    let suppliesLoading = false;    // 用品列表是否正在加载

    // ========== 本地缓存工具 ==========
    const CACHE_PREFIX = 'ppe_cache_';
    const CACHE_EXPIRE = {
      line: 7 * 24 * 60 * 60 * 1000,       // 产线信息缓存7天
      teamLeaders: 1 * 24 * 60 * 60 * 1000 // 班组长列表缓存1天
    };
    function getCache(key, expireMs) {
      try {
        const raw = localStorage.getItem(CACHE_PREFIX + key);
        if (!raw) return null;
        const { data, timestamp } = JSON.parse(raw);
        if (Date.now() - timestamp > expireMs) return null;
        return data;
      } catch (e) { return null; }
    }
    function setCache(key, data) {
      try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ data, timestamp: Date.now() })); } catch (e) {}
    }
    function clearCache(key) {
      try { localStorage.removeItem(CACHE_PREFIX + key); } catch (e) {}
    }

    // ========== 初始化（先渲染表单，后台并行加载） ==========
    function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const lineToken = urlParams.get('line') || 'line-a-token';

      // 1. 立即显示表单（产线名称先显示加载中，班组长下拉先显示加载中）
      const cachedLine = getCache('line_' + lineToken, CACHE_EXPIRE.line);
      if (cachedLine) {
        currentLine = cachedLine;
        document.getElementById('lineName').value = cachedLine.name;
        document.getElementById('pageTitle').textContent = cachedLine.name + ' - 领用登记';
      } else {
        document.getElementById('lineName').value = '加载中...';
      }

      const cachedTL = getCache('teamLeaders_' + lineToken, CACHE_EXPIRE.teamLeaders);
      if (cachedTL && cachedTL.length > 0) {
        teamLeaders = cachedTL;
        renderTeamLeaders();
      } else {
        const select = document.getElementById('teamLeaderSelect');
        select.innerHTML = '<option value="">加载中...</option>';
      }

      // 2. 自动填充上次填写的员工信息（已有缓存，直接用）
      fillSavedEmployeeInfo(lineToken);

      // 3. 后台并行加载产线信息和班组长列表（不阻塞员工填表）
      lineLoadPromise = loadLineInfo(lineToken);
      teamLeadersLoadPromise = loadTeamLeaders(lineToken);

      // 4. 产线信息加载完后，后台预加载用品列表（进入step2时就有数据了）
      lineLoadPromise.then(() => { if (currentLine) preloadSupplies(); });
    }

    // 加载产线信息（后台异步，完成后更新UI）
    async function loadLineInfo(lineToken) {
      try {
        const { data: lineData, error } = await supabase
          .from('production_lines')
          .select('*')
          .eq('qr_token', lineToken)
          .eq('status', 'active')
          .single();
        if (error || !lineData) {
          if (!currentLine) {
            document.getElementById('lineName').value = '产线信息加载失败';
            Common.toast('无效的产线二维码，请联系管理员', 'error');
          }
          return;
        }
        currentLine = lineData;
        document.getElementById('lineName').value = lineData.name;
        document.getElementById('pageTitle').textContent = lineData.name + ' - 领用登记';
        setCache('line_' + lineToken, lineData);
      } catch (e) {
        if (!currentLine) {
          document.getElementById('lineName').value = '产线信息加载失败';
        }
      }
    }

    // 加载班组长列表（后台异步，完成后更新下拉）
    async function loadTeamLeaders(lineToken) {
      try {
        // 先等产线信息加载完（需要line_id）
        if (lineLoadPromise) await lineLoadPromise;
        if (!currentLine) return;

        const { data: tlData } = await supabase
          .from('users')
          .select('id, name, team_id, teams(name)')
          .eq('role', 'team_leader')
          .eq('line_id', currentLine.id)
          .eq('status', 'active');
        teamLeaders = tlData || [];
        renderTeamLeaders();
        if (teamLeaders.length > 0) {
          setCache('teamLeaders_' + lineToken, teamLeaders);
        }
      } catch (e) {
        // 加载失败，如果没有缓存数据，提示用户
        if (teamLeaders.length === 0) {
          const select = document.getElementById('teamLeaderSelect');
          select.innerHTML = '<option value="">加载失败，请刷新重试</option>';
        }
      }
    }

    // 渲染班组长下拉（保留员工已选的）
    function renderTeamLeaders() {
      const select = document.getElementById('teamLeaderSelect');
      const currentVal = select.value;
      select.innerHTML = '<option value="">请选择班组长</option>';
      teamLeaders.forEach(tl => {
        const opt = document.createElement('option');
        opt.value = tl.id;
        opt.textContent = tl.name + '（' + (tl.teams?.name || '') + '）';
        select.appendChild(opt);
      });
      // 恢复员工已选的班组长
      if (currentVal && teamLeaders.find(t => t.id === currentVal)) {
        select.value = currentVal;
      }
    }

    // 自动填充上次填写的员工信息
    function fillSavedEmployeeInfo(lineToken) {
      const savedInfo = localStorage.getItem('ppe_emp_info_' + lineToken);
      if (savedInfo) {
        try {
          const info = JSON.parse(savedInfo);
          if (info.name) document.getElementById('employeeName').value = info.name;
          if (info.teamLeaderId) {
            // 等班组长列表加载完后再设置选中
            if (teamLeadersLoadPromise) {
              teamLeadersLoadPromise.then(() => {
                document.getElementById('teamLeaderSelect').value = info.teamLeaderId;
              });
            } else {
              document.getElementById('teamLeaderSelect').value = info.teamLeaderId;
            }
          }
          if (info.workerType) {
            const radio = document.querySelector(`input[name="workerType"][value="${info.workerType}"]`);
            if (radio) radio.checked = true;
          }
        } catch (e) {}
      }
    }

    // 手动刷新数据（清除缓存并重新加载）
    function refreshData() {
      const urlParams = new URLSearchParams(window.location.search);
      const lineToken = urlParams.get('line') || 'line-a-token';
      clearCache('line_' + lineToken);
      clearCache('teamLeaders_' + lineToken);
      teamLeaders = [];
      supplies = [];
      document.getElementById('lineName').value = '加载中...';
      document.getElementById('teamLeaderSelect').innerHTML = '<option value="">加载中...</option>';
      lineLoadPromise = loadLineInfo(lineToken);
      teamLeadersLoadPromise = loadTeamLeaders(lineToken);
      lineLoadPromise.then(() => { if (currentLine) preloadSupplies(); });
      Common.toast('正在刷新数据...', 'success');
    }

    // ========== 用品加载与选择 ==========
    // 后台预加载用品列表（进入step2时就有数据了）
    function preloadSupplies() {
      if (supplies.length > 0 || suppliesLoading) return;
      loadSupplies();
    }

    async function loadSupplies() {
      if (suppliesLoading) return;
      suppliesLoading = true;
      try {
        const { data } = await supabase
          .from('supply_stock')
          .select('supply_id, quantity, supplies(id, name, spec, unit, status, safety_stock, max_claim)')
          .eq('line_id', currentLine.id)
          .gt('quantity', 0);
        supplies = (data || []).filter(s => s.supplies);
        renderSupplyList();
      } catch (e) {
        console.error('用品列表加载失败', e);
      } finally {
        suppliesLoading = false;
      }
    }

    function renderSupplyList() {
      const list = document.getElementById('supplyList');
      if (supplies.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="icon">📦</div><p>当前产线暂无可用库存</p></div>';
        return;
      }
      list.innerHTML = supplies.map(s => {
        const isSelected = selectedSupplies.find(x => x.supply_id === s.supply_id);
        const lowStock = s.quantity <= (s.supplies.safety_stock || 0);
        const maxClaim = s.supplies.max_claim || 0;
        return `
          <div class="supply-item ${isSelected ? 'selected' : ''}" onclick="toggleSupply('${s.supply_id}')">
            <div class="supply-name">${Common.escapeHtml(s.supplies.name)}</div>
            <div class="supply-spec">${Common.escapeHtml(s.supplies.spec || '')}</div>
            <div class="stock ${lowStock ? 'low' : ''}">库存: ${s.quantity}${maxClaim > 0 ? ` · 单次限${maxClaim}` : ''}</div>
          </div>`;
      }).join('');
    }

    function toggleSupply(supplyId) {
      const s = supplies.find(x => x.supply_id === supplyId);
      if (!s) return;
      const idx = selectedSupplies.findIndex(x => x.supply_id === supplyId);
      if (idx >= 0) {
        selectedSupplies.splice(idx, 1);
      } else {
        selectedSupplies.push({
          supply_id: s.supply_id, name: s.supplies.name, spec: s.supplies.spec,
          unit: s.supplies.unit, qty: 1, stock: s.quantity, max_claim: s.supplies.max_claim || 0
        });
      }
      renderSupplyList();
      renderSelectedItems();
    }

    function renderSelectedItems() {
      const area = document.getElementById('selectedItems');
      if (selectedSupplies.length === 0) { area.innerHTML = ''; return; }
      area.innerHTML = '<div style="margin-top:12px;padding:10px;background:#f5f7fa;border-radius:6px;">' +
        '<div style="font-weight:600;margin-bottom:8px;font-size:13px;">已选用品（填写数量）：</div>' +
        selectedSupplies.map((s, i) => `
          <div class="item-row">
            <div style="flex:1;min-width:100px;">
              <div style="font-size:13px;font-weight:500;">${Common.escapeHtml(s.name)}</div>
              <div style="font-size:11px;color:#999;">${Common.escapeHtml(s.spec||'')}</div>
            </div>
            <input type="number" min="1" max="${s.max_claim > 0 ? Math.min(s.stock, s.max_claim) : s.stock}" value="${s.qty}" onchange="updateQty(${i}, this.value)">
            <span class="unit">${Common.escapeHtml(s.unit||'')}</span>
            <button class="btn btn-danger btn-sm" onclick="removeSupply(${i})">删</button>
          </div>`).join('') + '</div>';
    }

    function updateQty(idx, val) {
      const v = parseInt(val) || 1;
      const s = selectedSupplies[idx];
      let maxVal = s.stock;
      if (s.max_claim > 0) maxVal = Math.min(maxVal, s.max_claim);
      s.qty = Math.max(1, Math.min(v, maxVal));
      if (s.qty < v) {
        Common.toast(s.max_claim > 0 ? `单次最多领用${s.max_claim}${s.unit||''}` : `库存不足，最多${s.stock}${s.unit||''}`, 'error');
      }
    }

    function removeSupply(idx) {
      selectedSupplies.splice(idx, 1);
      renderSupplyList();
      renderSelectedItems();
    }

    // ========== 步骤导航 ==========
    function clearSignature() { sigPad.clear(); }

    function goStep1() { showStep('step1'); }
    function goStep2() {
      const name = document.getElementById('employeeName').value.trim();
      const tl = document.getElementById('teamLeaderSelect').value;
      const wt = document.querySelector('input[name="workerType"]:checked');
      if (!name) { Common.toast('请输入姓名', 'error'); return; }
      if (!tl) {
        if (teamLeaders.length === 0) {
          Common.toast('班组长列表加载中，请稍候', 'error');
        } else {
          Common.toast('请选择班组长', 'error');
        }
        return;
      }
      if (!wt) { Common.toast('请选择用工性质', 'error'); return; }
      showStep('step2');
      // 用品列表如果还没加载完，显示加载中并等待
      if (supplies.length === 0) {
        const list = document.getElementById('supplyList');
        list.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>用品列表加载中...</p></div>';
        if (!suppliesLoading) loadSupplies();
      }
    }
    function goStep3() {
      if (selectedSupplies.length === 0) { Common.toast('请至少选择一种用品', 'error'); return; }
      const name = document.getElementById('employeeName').value.trim();
      const tlName = document.getElementById('teamLeaderSelect').selectedOptions[0].text;
      const wt = document.querySelector('input[name="workerType"]:checked').value === 'formal' ? '正式工' : '劳务工';
      document.getElementById('summaryArea').innerHTML = `
        <div style="background:#f5f7fa;padding:10px;border-radius:6px;font-size:13px;">
          <div><strong>姓名：</strong>${Common.escapeHtml(name)}（${wt}）</div>
          <div><strong>班组长：</strong>${Common.escapeHtml(tlName)}</div>
          <div style="margin-top:6px;"><strong>领用明细：</strong></div>
          ${selectedSupplies.map(s => `<div style="padding-left:12px;">· ${Common.escapeHtml(s.name)} ${Common.escapeHtml(s.spec||'')} × ${s.qty} ${Common.escapeHtml(s.unit||'')}</div>`).join('')}
        </div>`;
      showStep('step3');
      setTimeout(() => { if (!sigPad) sigPad = new SignaturePad('signatureCanvas'); }, 50);
    }

    function showStep(stepId) {
      ['step1','step2','step3','stepVoucher','stepHistory'].forEach(id => {
        document.getElementById(id).style.display = 'none';
      });
      document.getElementById(stepId).style.display = 'block';
      window.scrollTo(0, 0);
    }

    // ========== 提交领用 ==========
    async function submitRequisition() {
      if (sigPad.isEmpty()) { Common.toast('请先手写签名', 'error'); return; }
      Common.showLoading('提交中...');
      try {
        const name = document.getElementById('employeeName').value.trim();
        const tlId = document.getElementById('teamLeaderSelect').value;
        const tlName = document.getElementById('teamLeaderSelect').selectedOptions[0].text;
        const wt = document.querySelector('input[name="workerType"]:checked').value;
        const reqNo = Common.genNo('REQ');
        const signImage = sigPad.toDataURL();

        const { data: reqData, error: reqError } = await supabase
          .from('requisitions')
          .insert({
            req_no: reqNo, line_id: currentLine.id, employee_name: name,
            worker_type: wt, team_leader_id: tlId, sign_image: signImage, status: 'pending'
          })
          .select('id, created_at')
          .single();
        if (reqError) throw reqError;

        const items = selectedSupplies.map(s => ({
          req_id: reqData.id, supply_id: s.supply_id, name: s.name,
          spec: s.spec, unit: s.unit, qty: s.qty
        }));
        const { error: itemError } = await supabase.from('requisition_items').insert(items);
        if (itemError) throw itemError;

        await supabase.from('operation_logs').insert({
          operator_id: null, operator_name: name, role: 'employee',
          action: 'submit_requisition', ref_type: 'requisition', ref_id: reqData.id,
          detail: '员工提交领用单，指定班组长：' + tlName
        });

        // 保存员工信息
        localStorage.setItem('ppe_emp_info_' + currentLine.qr_token, JSON.stringify({
          name: name, teamLeaderId: tlId, workerType: wt
        }));

        // 保存领用记录到本地历史
        saveToHistory({
          req_no: reqNo,
          created_at: reqData.created_at,
          employee_name: name,
          worker_type: wt,
          team_leader_name: tlName,
          items: items.map(i => ({ name: i.name, spec: i.spec, unit: i.unit, qty: i.qty })),
          sign_image: signImage,
          status: 'pending'
        });

        // 展示凭证单
        voucherBackTarget = 'step1';
        renderVoucher({
          req_no: reqNo,
          created_at: reqData.created_at,
          employee_name: name,
          worker_type: wt,
          team_leader_name: tlName,
          items: items,
          sign_image: signImage,
          status: 'pending'
        }, true);
        showStep('stepVoucher');

      } catch (e) {
        console.error(e);
        Common.toast('提交失败：' + (e.message || '未知错误'), 'error');
      }
      Common.hideLoading();
    }

    function resetForm() {
      selectedSupplies = [];
      if (sigPad) sigPad.clear();
      renderSupplyList();
      renderSelectedItems();
      showStep('step1');
    }

    // ========== 领用凭证单渲染 ==========
    function statusText(s) {
      if (s === 'pending') return '待班组长确认';
      if (s === 'approved') return '已确认';
      if (s === 'rejected') return '已驳回';
      return s;
    }
    function statusClass(s) {
      if (s === 'pending') return 'status-pending';
      if (s === 'approved') return 'status-approved';
      if (s === 'rejected') return 'status-rejected';
      return '';
    }

    function renderVoucher(data, isNew) {
      const wtText = data.worker_type === 'formal' ? '正式工' : (data.worker_type === 'labor' ? '劳务工' : data.worker_type);
      const timeStr = data.created_at ? new Date(data.created_at).toLocaleString('zh-CN') : '';
      const rejectReason = data.reject_reason ? `<div class="reject-reason"><strong>驳回原因：</strong>${Common.escapeHtml(data.reject_reason)}</div>` : '';

      document.getElementById('voucherContent').innerHTML = `
        <div class="voucher-card">
          <div class="voucher-header">
            <h3>劳动防护用品领用凭证</h3>
            <div class="voucher-reqno">凭证编号：${Common.escapeHtml(data.req_no)}</div>
            <div style="margin-top:8px;"><span class="status-badge ${statusClass(data.status)}">${statusText(data.status)}</span></div>
          </div>
          <div class="voucher-info-row"><span class="label">产线</span><span class="value">${Common.escapeHtml(currentLine.name)}</span></div>
          <div class="voucher-info-row"><span class="label">姓名</span><span class="value">${Common.escapeHtml(data.employee_name)}（${wtText}）</span></div>
          <div class="voucher-info-row"><span class="label">班组长</span><span class="value">${Common.escapeHtml(data.team_leader_name || '')}</span></div>
          <div class="voucher-info-row"><span class="label">申请时间</span><span class="value">${timeStr}</span></div>
          <table class="voucher-table">
            <thead><tr><th style="width:30px;">序号</th><th>用品名称</th><th>规格型号</th><th style="width:50px;">数量</th><th style="width:40px;">单位</th></tr></thead>
            <tbody>
              ${data.items.map((item, i) => `
                <tr>
                  <td style="text-align:center;">${i+1}</td>
                  <td>${Common.escapeHtml(item.name)}</td>
                  <td>${Common.escapeHtml(item.spec || '')}</td>
                  <td style="text-align:center;">${item.qty}</td>
                  <td style="text-align:center;">${Common.escapeHtml(item.unit || '')}</td>
                </tr>`).join('')}
            </tbody>
          </table>
          <div class="voucher-sign-area">
            <img src="${data.sign_image}" alt="员工签名">
            <div class="voucher-sign-label">员工手写签名</div>
          </div>
          ${rejectReason}
        </div>
        ${isNew ? `<div style="text-align:center;padding:8px; background:#fffbeb; border-radius:6px; font-size:13px; color:#92400e;">
          ⚠️ 请出示本凭证给班组长核对，确认后领取实物
        </div>` : ''}
        ${!isNew && data.status === 'pending' ? `<div style="text-align:center;padding:8px; background:#eff6ff; border-radius:6px; font-size:12px; color:#1e40af;">
          状态已更新至最新
        </div>` : ''}
      `;
      // 返回按钮文字
      document.getElementById('voucherBackBtn').textContent = voucherBackTarget === 'stepHistory' ? '返回记录列表' : '返回填写信息';
    }

    // ========== 历史记录 ==========
    function getHistoryKey() {
      return 'ppe_emp_records_' + currentLine.qr_token;
    }

    function saveToHistory(record) {
      const key = getHistoryKey();
      let records = [];
      try { records = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) {}
      // 去重：同req_no不重复添加
      if (!records.find(r => r.req_no === record.req_no)) {
        records.unshift(record);
        // 最多保留50条
        if (records.length > 50) records = records.slice(0, 50);
        localStorage.setItem(key, JSON.stringify(records));
      }
    }

    async function showHistory() {
      const key = getHistoryKey();
      let records = [];
      try { records = JSON.parse(localStorage.getItem(key) || '[]'); } catch (e) {}

      const listEl = document.getElementById('historyList');
      if (records.length === 0) {
        listEl.innerHTML = '<div class="history-empty"><div style="font-size:36px;margin-bottom:8px;">📭</div><p>暂无领用记录</p></div>';
      } else {
        listEl.innerHTML = records.map(r => {
          const timeStr = r.created_at ? new Date(r.created_at).toLocaleString('zh-CN') : '';
          const itemsSummary = r.items.slice(0, 2).map(i => `${i.name}×${i.qty}`).join('、') + (r.items.length > 2 ? ` 等${r.items.length}项` : '');
          return `
            <div class="history-item" onclick="viewHistoryDetail('${r.req_no}')">
              <div class="history-item-top">
                <span class="history-reqno">${Common.escapeHtml(r.req_no)}</span>
                <span class="status-badge ${statusClass(r.status)}">${statusText(r.status)}</span>
              </div>
              <div class="history-time">${timeStr}</div>
              <div class="history-items">${Common.escapeHtml(itemsSummary)}</div>
            </div>`;
        }).join('');
      }
      voucherBackTarget = 'stepHistory';
      showStep('stepHistory');
    }

    async function viewHistoryDetail(reqNo) {
      Common.showLoading('查询中...');
      try {
        // 先从本地历史取基础数据
        const key = getHistoryKey();
        let localRecord = null;
        try {
          const records = JSON.parse(localStorage.getItem(key) || '[]');
          localRecord = records.find(x => x.req_no === reqNo);
        } catch (e) {}

        // 从系统查询最新状态（不关联users表，避免关联查询失败）
        let reqData = null;
        let queryError = null;
        try {
          const { data, error } = await supabase
            .from('requisitions')
            .select('id, req_no, created_at, employee_name, worker_type, status, reject_reason, sign_image, team_leader_id')
            .eq('req_no', reqNo)
            .single();
          if (error) { queryError = error; reqData = null; }
          else reqData = data;
        } catch (e) { queryError = e; reqData = null; }

        if (reqData) {
          // 查询明细
          let itemsData = [];
          try {
            const { data: items } = await supabase
              .from('requisition_items')
              .select('name, spec, unit, qty')
              .eq('req_id', reqData.id);
            itemsData = items || [];
          } catch (e) {}

          // 查询班组长姓名
          let tlName = localRecord?.team_leader_name || '';
          if (!tlName && reqData.team_leader_id) {
            try {
              const { data: tl } = await supabase
                .from('users')
                .select('name')
                .eq('id', reqData.team_leader_id)
                .single();
              if (tl) tlName = tl.name;
            } catch (e) {}
          }

          const voucherData = {
            req_no: reqData.req_no,
            created_at: reqData.created_at,
            employee_name: reqData.employee_name,
            worker_type: reqData.worker_type,
            team_leader_name: tlName,
            items: itemsData,
            sign_image: reqData.sign_image,
            status: reqData.status,
            reject_reason: reqData.reject_reason
          };
          updateHistoryStatus(reqNo, reqData.status, reqData.reject_reason);
          voucherBackTarget = 'stepHistory';
          renderVoucher(voucherData, false);
          showStep('stepVoucher');
        } else if (localRecord) {
          // 系统查询失败，回退到本地数据展示（状态可能不是最新）
          Common.toast('网络查询受限，显示本地凭证（状态可能未更新）', 'warn');
          voucherBackTarget = 'stepHistory';
          renderVoucher(localRecord, false);
          showStep('stepVoucher');
        } else {
          Common.toast('未找到该领用记录', 'error');
        }
      } catch (e) {
        console.error(e);
        Common.toast('查询失败：' + (e.message || '未知错误'), 'error');
      }
      Common.hideLoading();
    }

    function updateHistoryStatus(reqNo, status, rejectReason) {
      const key = getHistoryKey();
      try {
        let records = JSON.parse(localStorage.getItem(key) || '[]');
        const r = records.find(x => x.req_no === reqNo);
        if (r) {
          r.status = status;
          if (rejectReason) r.reject_reason = rejectReason;
          localStorage.setItem(key, JSON.stringify(records));
        }
      } catch (e) {}
    }

    function voucherBack() {
      showStep(voucherBackTarget);
      if (voucherBackTarget === 'stepHistory') showHistory();
    }

    // 启动
    init();
  </script>
</body>
</html>
